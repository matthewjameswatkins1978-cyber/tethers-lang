name: Tethers verification foundations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-verification:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required CI tools
        shell: pwsh
        run: |
          pwsh -NoProfile -Command "Get-Command git, cargo, rustfmt | Out-Null"
      - name: Rust formatting
        shell: pwsh
        run: cargo fmt --manifest-path tethers-0.1/host-rust/Cargo.toml --all -- --check
      - name: Rust static checks
        shell: pwsh
        run: cargo check --manifest-path tethers-0.1/host-rust/Cargo.toml --all-targets --all-features --locked
      - name: Packet checker tests
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/test-check-tethers-task-packet.ps1
      - name: Compatibility corpus
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-compatibility-corpus.ps1
      - name: Whitespace and repository checks
        shell: pwsh
        run: git diff --check

  linux-native-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Install OCaml toolchain
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.0"
      - name: Install OCaml dependencies
        run: opam install --yes dune.3.24.0 yojson.2.2.2 digestif.1.3.1
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Export native switch root
        shell: bash
        run: echo "TETHERS_OCAML_SWITCH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Native Linux aggregate verification
        shell: pwsh
        run: just verify
      - name: Native Linux package build
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package-linux.ps1 -OcamlSwitchPath "$env:TETHERS_OCAML_SWITCH"
      - name: Native Linux package clean-install smoke
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-linux-package.ps1 -Archive (Get-ChildItem dist/*.tar.gz | Select-Object -First 1).FullName
