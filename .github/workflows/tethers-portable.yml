name: Tethers Portable 0.1

on:
  workflow_dispatch:
  push:
    paths:
      - "tethers-0.1/portable-rust/**"
      - "tethers-0.1/scripts/package-portable.ps1"
      - ".github/workflows/tethers-portable.yml"
  pull_request:
    paths:
      - "tethers-0.1/portable-rust/**"
      - "tethers-0.1/scripts/package-portable.ps1"
      - ".github/workflows/tethers-portable.yml"

jobs:
  test-and-package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: windows-x64
            target: x86_64-pc-windows-msvc
            binary: tethers.exe
          - os: ubuntu-latest
            rid: linux-x64-musl
            target: x86_64-unknown-linux-musl
            binary: tethers
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tethers-0.1/portable-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux musl tools
        if: matrix.rid == 'linux-x64-musl'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo test --locked
      - name: Build release
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rid == 'windows-x64' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Linux executable smoke tests
        if: matrix.rid == 'linux-x64-musl'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test -x "$binary"
          file "$binary" | grep -Eq 'ELF 64-bit.*x86-64'
          if readelf -l "$binary" | grep -q 'INTERP'; then
            echo 'expected the musl release binary to have no dynamic loader' >&2
            exit 1
          fi

          check_decision() {
            local expected="$1"
            local input="$2"
            local output
            local error_file
            error_file="$(mktemp)"
            output="$(printf '%s' "$input" | "$binary" evaluate --policy policies/default.json 2>"$error_file")"
            test ! -s "$error_file"
            rm -f "$error_file"
            printf '%s' "$output" | jq -e --arg expected "$expected" '.decision == $expected and (.error == null)' >/dev/null
          }

          check_decision ALLOW '{"action":{"name":"call.read","version":1},"context":{}}'
          check_decision ASK '{"action":{"name":"git.push","version":1},"context":{}}'
          check_decision DENY '{"action":{"name":"system.delete","version":1},"context":{}}'

          malformed="$(printf '{' | "$binary" evaluate 2>/dev/null)"
          printf '%s' "$malformed" | jq -e '.decision == "DENY" and (.error | type == "string")' >/dev/null
      - name: Stage bundle
        shell: pwsh
        working-directory: tethers-0.1
        env:
          RID: ${{ matrix.rid }}
          BINARY: ${{ matrix.binary }}
        run: |
          $version = (Get-Content -Raw -LiteralPath portable-rust/VERSION).Trim()
          $stage = Join-Path "dist" "tethers-portable-${version}-${env:RID}"
          $zip = "${stage}.zip"
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath "portable-rust/target/${{ matrix.target }}/release/${env:BINARY}" -Destination (Join-Path $stage $env:BINARY)
          Copy-Item -LiteralPath portable-rust/policies -Destination (Join-Path $stage policies) -Recurse
          Copy-Item -LiteralPath portable-rust/examples -Destination (Join-Path $stage examples) -Recurse
          Copy-Item -LiteralPath portable-rust/README.md,portable-rust/VERSION -Destination $stage
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $stage $env:BINARY)).Hash.ToLowerInvariant()
          "$hash  $env:BINARY" | Set-Content -LiteralPath (Join-Path $stage SHA256SUMS) -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: tethers-portable-${{ matrix.rid }}
          path: tethers-0.1/dist/*.zip
