name: Tethers Portable

on:
  push:
    tags: ['tethers-portable-v*']
  workflow_dispatch:

jobs:
  linux-x64-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo test --locked
      - run: pwsh -NoProfile -File ./scripts/package-portable.ps1 -Target linux-x64-musl
      - uses: actions/upload-artifact@v4
        with:
          name: tethers-portable-linux-x64-musl
          path: dist/*linux-x64-musl*
