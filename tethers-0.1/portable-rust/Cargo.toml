[package]
name = "tethers-portable"
version = "0.2.2"
edition = "2021"
rust-version = "1.97"
publish = false

[lib]
name = "tethers_portable"
path = "src/lib.rs"

[[bin]]
name = "tethers"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
