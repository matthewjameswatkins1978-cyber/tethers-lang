[package]
name = "tethers-reference-host"
version = "0.2.2"
edition = "2021"
rust-version = "1.97"
publish = false

[[bin]]
name = "tethers-reference-host"
path = "src/main.rs"

[[bin]]
name = "tethers"
path = "src/main.rs"

[[bin]]
name = "agent_workspace_provider"
path = "src/bin/agent_workspace_provider.rs"

[[bin]]
name = "agent_coding_provider"
path = "src/bin/agent_coding_provider.rs"

[[bin]]
name = "bench_mcp"
path = "src/bin/bench_mcp.rs"
required-features = ["benchmark-binaries"]

[[bin]]
name = "bench_prod"
path = "src/bin/bench_prod.rs"
required-features = ["benchmark-binaries"]

[[bin]]
name = "bench_cold"
path = "src/bin/bench_cold.rs"
required-features = ["benchmark-binaries"]

[[bin]]
name = "bench_retained"
path = "src/bin/bench_retained.rs"
required-features = ["benchmark-binaries"]

[features]
default = []
benchmark-binaries = []
# Observation-only stage timing for the PF1 benchmark binaries. Disabled in
# every normal build; see src/bench_timing.rs.
bench-timing = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = { version = "2.1.1", features = ["pkcs8"] }
clap = { version = "4", features = ["derive"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Console"
] }

[dev-dependencies]
hex = "0.4"
