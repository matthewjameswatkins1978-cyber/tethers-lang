[package]
name = "tethers-text-stats-provider"
version = "1.0.0"
edition = "2021"
rust-version = "1.97"
description = "MCP stdio provider for the Tethers Text Stats capability (text.stats@1)."
license = "MIT"

[[bin]]
name = "tethers_text_stats_provider"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
